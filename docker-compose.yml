version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telehealth
      POSTGRES_PASSWORD: telehealth_dev
      POSTGRES_DB: telehealth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telehealth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
