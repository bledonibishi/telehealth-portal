if(act==='back')return back();if(act==='next')return advance(q);if(act==='calc')return doCalc();

root.addEventListener('submit',function(e){
e.preventDefault();
var f=e.target,el=f.elements,er=f.querySelector('[data-err]'),btn=f.querySelector('button[type=submit]');
var d={firstName:el.firstName.value.trim(),lastName:el.lastName.value.trim(),email:el.email.value.trim()};
if(!d.firstName||!d.lastName){er.textContent='Please enter your first and last name.';return;}
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)){er.textContent='Please enter a valid email address.';return;}
if(!el.consent.checked){er.textContent='Please tick the box to confirm and continue.';return;}
er.textContent='';btn.disabled=true;btn.textContent='Saving…';
function finish(id){merge({product:product,passed:true,leadId:id,email:d.email,at:Date.now(),plan:null,method:null,payseraMethod:null});show('plans');}
createLead(d).then(finish).catch(function(ex){console.error('[primavera] createLead failed:',ex);finish(null);});
});
document.addEventListener('click',function(e){
var b=e.target.closest('[data-th-plan]');if(!b)return;e.preventDefault();
var k=b.getAttribute('data-th-plan'),p=CONFIG.PLANS[k],s=load();
if(!p||!s||!s.passed||p.product!==s.product)return;
merge({plan:k});window.location.href='/checkout?plan='+encodeURIComponent(k);
});
document.addEventListener('click',function(e){if(!e.target.closest('[data-th-restart]'))return;e.preventDefault();show('quiz');render();});
var saved=load();
if(param('resume')==='1'&&saved&&saved.passed&&saved.product===product)show('plans',true);else show('quiz',true);
render();
})();
</script>
